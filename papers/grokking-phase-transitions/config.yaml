project:
  name: "grokking-phase-transitions"
  mode: "full-auto"

research:
  topic: >
    Phase Transitions in Feature Space: A Unified Theory of Grokking and Neural Scaling Laws.
    We unify two major phenomena in deep learning theory — grokking (delayed generalization)
    and neural scaling laws — by showing they are manifestations of the same underlying phase
    transition in feature space. Building on the Li2 framework and the NeurIPS 2025 result
    connecting scaling laws to representation superposition, we prove that grokking occurs
    precisely when the model transitions from the superposition regime (memorization) to the
    clean-feature regime (generalization), and that scaling laws emerge from the rate of this
    transition. Our theory predicts a sharp critical dataset size below which grokking is
    impossible and above which it is guaranteed, yielding the first provable connection between
    scaling laws and generalization dynamics. We validate predictions on modular arithmetic,
    sparse parity, and small-scale language modeling.
  domains:
    - "machine-learning"
    - "deep-learning-theory"
    - "scaling-laws"
    - "grokking"
    - "phase-transitions"
  daily_paper_count: 20
  quality_threshold: 4.0

runtime:
  timezone: "America/New_York"
  max_parallel_tasks: 3
  approval_timeout_hours: 12
  retry_limit: 3

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "acp"
  primary_model: "claude"
  fallback_models: []

  acp:
    agent: "claude"
    session_name: "researchclaw-grokking-paper"
    timeout_sec: 1800

security:
  hitl_required_stages: []
  allow_publish_without_approval: true
  redact_sensitive_logs: true

experiment:
  mode: "sandbox"
  time_budget_sec: 600
  max_iterations: 5
  metric_key: "primary_metric"
  metric_direction: "minimize"
  sandbox:
    python_path: ".venv/bin/python3"
    gpu_required: false
    max_memory_mb: 4096

  figure_agent:
    enabled: true
    min_figures: 4
    max_figures: 8
    max_iterations: 3
    render_timeout_sec: 30
    output_format: "python"
    nano_banana_enabled: false
    strict_mode: false
    dpi: 300

prompts:
  custom_file: ""

metaclaw_bridge:
  enabled: false
