project:
  name: "semcp-conformal-prediction"
  mode: "full-auto"

research:
  topic: >
    Semantically-Calibrated Conformal Prediction for Open-Ended Language Generation:
    Existing conformal prediction methods for LLMs operate at the token level,
    producing prediction sets that lack semantic coherence. We introduce Semantic
    Conformal Prediction (SemCP), which constructs prediction sets in embedding
    space rather than token space, providing coverage guarantees over meanings
    rather than strings. SemCP uses a novel nonconformity score based on semantic
    similarity kernels in the embedding space, combined with a calibration procedure
    that accounts for the many-to-one mapping from strings to meanings. We prove
    that SemCP achieves valid marginal coverage while producing 40-65% smaller
    prediction sets than token-level conformal methods, and demonstrate applications
    to hallucination detection, selective abstention, and uncertainty-aware
    retrieval-augmented generation.
  domains:
    - "machine-learning"
    - "conformal-prediction"
    - "large-language-models"
    - "uncertainty-quantification"
  daily_paper_count: 15
  quality_threshold: 4.0

runtime:
  timezone: "America/New_York"
  max_parallel_tasks: 3
  approval_timeout_hours: 12
  retry_limit: 3

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "acp"
  primary_model: "claude"
  fallback_models: []

  acp:
    agent: "claude"
    session_name: "researchclaw-semcp-paper"
    timeout_sec: 1800

security:
  hitl_required_stages: []
  allow_publish_without_approval: true
  redact_sensitive_logs: true

experiment:
  mode: "simulated"
  time_budget_sec: 600
  max_iterations: 5
  metric_key: "primary_metric"
  metric_direction: "minimize"
  sandbox:
    python_path: ".venv/bin/python3"
    gpu_required: false
    max_memory_mb: 4096

  figure_agent:
    enabled: true
    min_figures: 3
    max_figures: 8
    max_iterations: 3
    render_timeout_sec: 30
    output_format: "python"
    nano_banana_enabled: false
    strict_mode: false
    dpi: 300

prompts:
  custom_file: ""

metaclaw_bridge:
  enabled: false
